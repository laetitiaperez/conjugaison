html, body { height: 100% }
body { background: var(--bg); color: var(--encre); font: 15px/1.5 var(--texte); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 100% }

.vues button { padding: 6px 12px; border-right: 1px solid var(--trait) }
.vues button:last-child { border-right: 0 }
.vues button[aria-selected="true"] { background: var(--encre); color: var(--papier) }
.recherche { position: relative; flex: 1 1 200px; min-width: 0; max-width: 340px }

.outil { padding: 6px 10px; border: 1px solid var(--trait); border-radius: 8px; background: var(--papier) }
.filtres { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; font-size: 13.5px }
.fg { display: flex; flex-wrap: wrap; gap: 4px; align-items: center }
.fg > span { color: var(--doux); margin-right: 2px }
.puce { padding: 2px 9px; border: 1px solid var(--trait); border-radius: 999px; background: var(--papier) }

main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; min-height: 0 }

#canevas svg { position: absolute; inset: 0; pointer-events: none }
#canevas path { fill: none; stroke-width: 2; opacity: .55 }
.noeud { position: absolute; left: 0; top: 0; white-space: nowrap; padding: 3px 9px; border-radius: 7px; border: 1.5px solid var(--c); background: var(--papier); color: var(--encre); font-size: 14px; line-height: 20px; transition: transform .22s ease, opacity .15s }
.noeud.n1 { background: var(--c); color: var(--papier); font-weight: 700 }

.noeud.n1 .compte { color: inherit; opacity: .8 }

.noeud.sans { border-style: dashed }
#plan { list-style: none; margin: 0; padding: 8px }

#tableau-wrap { height: 100%; overflow: auto; background: var(--papier) }
table { border-collapse: collapse; width: 100% }

.fiche h3 { font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--doux); margin: 14px 0 4px }
.fiche p { margin: 0 0 6px }
.fiche ul, .fiche ol { margin: 0; padding-left: 18px }
.fiche li { margin-block: 2px }
.fil { font-size: 12.5px; color: var(--doux) }
.fil button { padding: 0; text-decoration: underline; text-underline-offset: 2px; color: inherit }
#fermer { position: absolute; right: 8px; top: 8px; display: none; padding: 2px 8px; border: 1px solid var(--trait); border-radius: 6px }
.valeurs dt { font-weight: 700 } .valeurs dd { margin: 0 0 5px }
.valeurs { margin: 0 }
.attention { border: 1.5px dashed var(--marge); border-radius: 6px; padding: 6px 10px; margin-top: 10px }
.sanssource { font-size: 13px; font-weight: 700; color: var(--marge); margin-bottom: 6px }
.liens { display: flex; flex-wrap: wrap; gap: 4px }
.onglets { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px }
.formes td { padding: 2px 10px 2px 0; border: 0; font-variant-numeric: tabular-nums }
.fiche .sources { font-size: 13px; padding-left: 16px }

#imprimable { display: none }

@page { size: A4; margin: 12mm }
@media print {

  #imprimable h3 { font-size: 10pt; margin: 0 }
  #imprimable p { margin: 0 }
  #imprimable small { color: #444 }

  n: "<i>Aller</i> n'en fait pas partie malgré son infinitif : il a plusieurs radicaux.",
  s: [["T", "p. 137"]], l: ["g3", "graphies"] },
{ id: "g2", p: "groupes", t: "2e groupe", tag: ["g2"],
  d: "Infinitif en <b>-ir</b> et plusieurs formes du radical en <b>-iss-</b>, dont le participe présent en <b>-issant</b> : <i>finir, finissant</i>.",
  n: "<i>Partir</i> n'est pas du 2e groupe : <i>partant</i>, et non <i>*partissant</i>. Le test est le participe présent, pas l'infinitif.",
  s: [["T", "p. 138"]], l: ["part-present", "g3"] },
{ id: "g3", p: "groupes", t: "3e groupe", tag: ["g3"],
  d: "Tous les autres verbes. Le groupe est très hétérogène : verbes en <b>-ir</b> sans <i>-issant</i> (<i>partir</i>), en <b>-oir</b> (<i>savoir</i>), en <b>-re</b> (<i>prendre</i>). On y rattache <i>aller</i>, <i>être</i> et <i>avoir</i>.",
  s: [["T", "p. 138"]], l: ["nb-radicaux", "g1"] },
{ id: "auxiliaires", p: "identifier", t: "Auxiliaires être et avoir",
  d: "<i>Être</i> et <i>avoir</i> servent d'outils pour former les temps composés. <i>Être</i> sert aussi à former la voix passive. Employés ainsi, ils ont un sens grammatical plutôt que lexical.",
  x: ["<i>J'ai mangé. Elle est partie.</i> (temps composés)", "<i>La souris est mangée par le chat.</i> (voix passive)"],
  n: "Dans <i>J'ai de l'argent</i>, <i>avoir</i> n'est pas auxiliaire : il signifie « posséder ».",
  s: [["T", "p. 139-140"]], l: ["choix-aux", "tcomposes", "passive"] },
{ id: "choix-aux", p: "auxiliaires", t: "Être ou avoir ?",
  d: "<i>Avoir</i> est le plus courant. <i>Être</i> s'emploie avec tous les verbes pronominaux, à la voix passive et avec certains verbes intransitifs de mouvement ou de changement d'état.",
  x: ["<i>aller, arriver, devenir, entrer, mourir, naître, partir, rester, sortir, tomber, venir</i> : être", "<i>Le soleil est sorti.</i> / <i>J'ai sorti le chien.</i>"],
  n: "L'auxiliaire peut changer avec la construction : <i>sortir</i> intransitif prend <i>être</i>, <i>sortir</i> transitif prend <i>avoir</i>.",
  s: [["QAX"]], l: ["pp-etre", "pp-avoir", "transitif-direct"] },
{ id: "semi-aux", p: "identifier", t: "Semi-auxiliaires",
  d: "Verbes suivis d'un infinitif qui ajoutent une indication d'aspect ou de modalité.",
  v: [["Futur proche (aller)", "<i>Je vais venir.</i>"], ["Passé proche (venir de)", "<i>Elle vient de partir.</i>"], ["Inchoatif (commencer à)", "<i>Elle commence à comprendre.</i>"], ["Progressif (être en train de)", "<i>Elle est en train de travailler.</i>"], ["Terminatif (finir de)", "<i>Elle a fini de travailler.</i>"], ["Modalité (devoir)", "<i>Elle a dû sortir.</i> (probabilité)"], ["Modalité (pouvoir)", "<i>Il peut être midi.</i> (possibilité)"]],
  s: [["T", "p. 140"]], l: ["asp-lexical", "factitive"] },
{ id: "constructions", p: "identifier", t: "Constructions du verbe",
  d: "La construction décrit ce que le verbe demande dans le groupe verbal. Elle commande la possibilité du passif et l'accord du participe passé.",
  s: [["T", "p. 84-85"]], l: ["transitif-direct", "attributif", "passive"] },
{ id: "transitif-direct", p: "constructions", t: "Transitif direct",
  d: "Le complément d'objet suit le verbe sans préposition : c'est le COD. Seuls ces verbes peuvent passer à la voix passive.",
  x: ["<i>Je vois les enfants.</i>"],
  s: [["T", "p. 84-85, 141"]], l: ["passive", "pp-avoir"] },
{ id: "transitif-indirect", p: "constructions", t: "Transitif indirect",
  d: "Le complément d'objet est introduit par une préposition : c'est le COI.",
  x: ["<i>Je parle à quelqu'un.</i>"],
  s: [["T", "p. 85"]], l: ["pp-avoir"] },
{ id: "intransitif", p: "constructions", t: "Intransitif",
  d: "Le verbe n'admet ni COD ni COI.",
  x: ["<i>Les chevaux galopent.</i>"],
  n: "Un même verbe peut avoir les deux emplois : <i>Les toits blanchissent</i> (intransitif), <i>La neige blanchit les toits</i> (transitif).",
  s: [["T", "p. 85, 141"]] },
{ id: "attributif", p: "constructions", t: "Attributif",
  d: "Le verbe relie le sujet à un attribut obligatoire. <i>Être</i> est le principal verbe attributif ; <i>rester</i> et <i>devenir</i> ajoutent une nuance d'aspect.",
  x: ["<i>Alice est grande.</i>"],
  n: "<i>Être</i> n'est pas attributif en soi : <i>Alice est sortie</i> est un emploi d'auxiliaire.",
  s: [["T", "p. 84, 87-89"], ["C4N", "programme de 5e"]], l: ["auxiliaires"] },
{ id: "impersonnel", p: "constructions", t: "Verbe impersonnel",
  d: "Son sujet <i>il</i> ne renvoie à rien : c'est un pur support grammatical.",
  x: ["<i>Il faut de la patience.</i>", "<i>Il pleuvait.</i>"],
  s: [["T", "p. 79, 142"]], l: ["vimpersonnelle"] },
{ id: "defectifs", p: "identifier", t: "Verbes défectifs", nosrc: true,
  d: "On appelle ainsi les verbes dont la conjugaison est incomplète. Aucune définition officielle n'a été trouvée : la terminologie emploie le mot seulement pour l'impératif, qu'elle dit « défectif » parce qu'il n'a que trois personnes.",
  n: "Fiche à vérifier : ne cite pas cette définition comme venant d'une source officielle.",
  s: [["T", "p. 149"]], l: ["imperatif"] },

// 2. CONSTRUIRE
{ id: "construire", p: "verbe", t: "Construire la forme",
  d: "Une forme verbale se décompose en morphèmes. L'analyse repère le radical, qui porte le sens, et la désinence, qui porte les indications de temps, de mode et de personne.",
  s: [["T", "p. 136-137"], ["C4N", "programme de 5e"]], l: ["decomposer", "radical", "desinence"] },
{ id: "decomposer", p: "construire", t: "Décomposer une forme",
  d: "La méthode pour analyser un verbe dans un texte : isoler le radical, puis séparer la désinence en marques.",
  deco: ["chant", "ai", "ent"],
  f: ["Retrouver l'infinitif et le radical : <i>chant-</i>.", "Isoler la désinence : <i>-aient</i>.", "Repérer la marque de temps et de mode : <i>-ai-</i>, celle de <i>je chantais</i>.", "Repérer la marque de personne : <i>-ent</i>, celle de <i>ils chantent</i>."],
  s: [["T", "p. 136-137"]], l: ["radical", "desinence", "marque-temps", "marque-personne"] },
{ id: "radical", p: "construire", t: "Le radical",
  d: "Il contient le sens lexical stable du verbe : <i>chant-</i> pour <i>chanter</i>.",
  n: "Pour le verbe, on peut dire indifféremment « base » ou « radical ». La distinction ne compte que dans le chapitre sur le lexique.",
  s: [["T", "p. 136-137"]], l: ["nb-radicaux", "graphies"] },
{ id: "nb-radicaux", p: "radical", t: "Nombre de radicaux", tag: ["g1", "g3"],
  d: "Beaucoup de verbes n'ont qu'un radical, d'autres en mobilisent plusieurs.",
  v: [["Un radical", "<i>chanter</i>"], ["Deux radicaux", "<i>lire</i> : <i>li-</i> (je lis), <i>lis-</i> (nous lisons)"], ["Trois radicaux", "<i>vivre</i> : <i>vi-, viv-, véc-</i>"], ["Plus de trois", "<i>être, avoir, aller</i>"]],
  n: "La terminologie ajoute <i>savoir</i> et <i>pouvoir</i> dans le niveau I (p. 33), mais pas dans le niveau II (p. 137).",
  s: [["T", "p. 33, 136-137"]], l: ["g3"] },
{ id: "graphies", p: "radical", t: "Graphies du radical", tag: ["g1"],
  d: "L'orthographe du radical change parfois pour garder le même son ou selon la règle de l'accent.",
  v: [["-ger", "<i>e</i> devant <i>a</i> : <i>il mangeait</i>"], ["-cer", "<i>ç</i> devant <i>a</i> : <i>je déplaçais</i>"], ["-oyer, -uyer", "<i>y</i> devient <i>i</i> au futur : <i>nettoierons</i>"], ["-ayer", "deux graphies : <i>payeront</i> ou <i>paieront</i>"], ["-eler, -eter", "<i>appeler, jeter</i> doublent la consonne ; 1990 étend <i>è</i> aux autres : <i>elle ruissèle</i>"], ["-érer, -éder", "accent grave admis au futur depuis 1990 : <i>cèderons</i>"]],
  n: "L'OQLF accepte les graphies traditionnelles et les graphies rectifiées. Le programme de 2026 écrit d'ailleurs <i>maitriser</i> sans accent.",
  s: [["QIF"], ["QFF"], ["QRE"], ["AFR"], ["C4N"]], l: ["futur", "imparfait"] },
{ id: "desinence", p: "construire", t: "La désinence",
  d: "Morphème placé à droite du radical, qui varie selon le temps, le mode et la personne : <i>-ais</i> dans <i>chantais</i>, <i>-erons</i> dans <i>chanterons</i>. En classe, on peut dire « terminaison ».",
  s: [["T", "p. 136"]], l: ["marque-temps", "marque-mode", "marque-personne"] },
{ id: "marque-temps", p: "desinence", t: "Marque de temps",
  d: "Partie de la désinence qui signale le temps : <i>-ai-</i> à l'imparfait, <i>-r-</i> au futur.",
  x: ["<i>je mange-r-ai</i> (futur)", "<i>je mange-r-ais</i> (conditionnel : <i>-r-</i> du futur + <i>-ais</i> de l'imparfait)"],
  s: [["T", "p. 137"], ["ECO", "p. 2"]], l: ["statut-cond", "futur"] },
{ id: "marque-mode", p: "desinence", t: "Marque de mode",
  d: "S'ajoute aux marques de temps et de personne : <i>-ss-</i> dans <i>que je finisse</i>.",
  s: [["T", "p. 34"]], l: ["subjonctif"] },
{ id: "marque-personne", p: "desinence", t: "Marque de personne",
  d: "Partie finale de la désinence, qui signale la personne et le nombre : <i>-ent</i> dans <i>ils chantaient</i>.",
  v: [["Présent, verbes en -er", "-e, -es, -e, -ons, -ez, -ent"], ["Présent, verbes en -ir", "-s, -s, -t, -ons, -ez, -ent"], ["Pouvoir, valoir, vouloir", "-x, -x, -t : <i>je veux</i>"], ["Radical en d ou t", "pas de -t : <i>il prend, il met</i>"]],
  n: "Les modes non personnels n'ont pas de marque de personne.",
  s: [["T", "p. 137"], ["QPT"], ["C4A", "p. 24"]], l: ["six-personnes", "nonpers"] },
{ id: "tsimples", p: "construire", t: "Temps simples", tag: ["simple"],
  d: "Temps conjugués sans auxiliaire. Ils expriment l'aspect non accompli.",
  x: ["<i>je chante, je chantais, je chantai, je chanterai, je chanterais</i>"],
  s: [["T", "p. 139, 146"]], l: ["ind-simples", "accompli"] },
{ id: "tcomposes", p: "construire", t: "Temps composés", tag: ["compose"],
  d: "Temps conjugués avec l'auxiliaire <i>être</i> ou <i>avoir</i> et le participe passé. Ils expriment l'aspect accompli.",
  f: ["Auxiliaire conjugué + participe passé.", "Le temps de l'auxiliaire donne le temps composé : présent de l'auxiliaire pour le passé composé, imparfait pour le plus-que-parfait."],
  x: ["<i>j'ai parlé, j'avais parlé, j'aurai parlé</i>"],
  s: [["T", "p. 139, 143-146"], ["QPC"]], l: ["ind-composes", "choix-aux", "accompli"] },
{ id: "tsurcomposes", p: "tcomposes", t: "Temps surcomposés", tag: ["compose"],
  d: "Formés de deux auxiliaires juxtaposés et du participe passé. Ils marquent l'antériorité par rapport à une forme composée et s'emploient surtout à l'oral.",
  x: ["<i>Quand elle a eu fait cela…</i>", "<i>Quand elle a été partie…</i>"],
  s: [["QSC"], ["AFT"]] },

// 3. MODES ET TEMPS
{ id: "modes", p: "verbe", t: "Modes et temps",
  d: "Les temps se regroupent en modes. Les modes personnels sont l'indicatif, le subjonctif et l'impératif. Les modes non personnels sont l'infinitif et le participe. Seul l'indicatif est temporel.",
  n: "Une valeur modale n'est pas un mode : un temps de l'indicatif peut avoir une valeur modale.",
  s: [["T", "p. 136, 143"]], l: ["modalite", "trois-temps"] },
{ id: "indicatif", p: "modes", t: "Indicatif", tag: ["ind"],
  d: "Mode personnel et seul mode temporel : il situe l'action dans le passé, le présent ou le futur. Il comporte dix temps, cinq simples et cinq composés.",
  s: [["T", "p. 143-144"]], l: ["ind-simples", "ind-composes", "statut-cond"] },
{ id: "statut-cond", p: "indicatif", t: "Conditionnel : temps ou mode ?", tag: ["ind"],
  d: "La terminologie officielle le classe parmi les temps de l'indicatif. La morphologie le montre : il est au futur ce que l'imparfait est au passé simple (<i>chanterai / chanterais // chantai / chantais</i>). Son emploi de base est un futur vu du passé.",
  x: ["<i>Je dis qu'elle viendra.</i> / <i>Je disais qu'elle viendrait.</i>"],
  n: "L'usage scolaire le présente encore parfois comme un mode, et Le Conjugueur aussi. Le programme de 2026 parle bien de « temps verbal de l'indicatif ».",
  s: [["T", "p. 36, 144-145"], ["C4N", "programme de 3e"], ["ECO", "p. 1-3"]], l: ["cond-present", "cond-passe", "modalite"] },
{ id: "ind-simples", p: "indicatif", t: "Temps simples de l'indicatif", tag: ["ind", "simple"],
  d: "Présent, imparfait, passé simple, futur, conditionnel présent.",
  s: [["T", "p. 144"]], l: ["tsimples"] },
{ id: "present", p: "ind-simples", t: "Présent", forme: "indicatif:Présent", tag: ["ind", "simple", "present"],
  tm: ["Indicatif", "simple", "—", "présent", "non accompli"],
  d: "Temps de base de l'actualité, aux valeurs très variées.",
  f: ["Verbes en -er : -e, -es, -e, -ons, -ez, -ent.", "Verbes en -ir réguliers et la plupart des irréguliers : -s, -s, -t, -ons, -ez, -ent."],
  v: [["Présent ponctuel", "<i>Je vous remercie.</i>"], ["Présent étendu", "<i>Il pleut depuis une heure.</i>"], ["Vérité générale", "<i>L'humain est mortel.</i>"], ["Présent de narration", "<i>Le soldat avance et la forteresse tombe.</i>"], ["Futur proche", "<i>J'arrive dans un instant.</i>"], ["Passé proche", "<i>Elle sort d'ici.</i>"], ["Valeur modale d'éventualité", "<i>Si tu viens, je serai heureux.</i>"], ["Valeur impérative", "<i>Tu sors d'ici !</i>"]],
  n: "Répétition n'est pas vérité générale : <i>Le chien de ma voisine aboie au moindre bruit</i> reste une situation particulière.",
  s: [["T", "p. 144-145"], ["QPT"], ["QPV"], ["EPR", "p. 1-2"]], l: ["marque-personne", "modalite"] },
{ id: "imparfait", p: "ind-simples", t: "Imparfait", forme: "indicatif:Imparfait", tag: ["ind", "simple", "passe"],
  tm: ["Indicatif", "simple", "—", "passé", "non accompli, non borné"],
  d: "Temps du passé qui présente l'action dans son déroulement, sans ses bornes. C'est le temps de l'arrière-plan.",
  f: ["Radical de la 1re personne du pluriel du présent : <i>nous mangeons</i> donne <i>mange-</i>.", "Terminaisons : -ais, -ais, -ait, -ions, -iez, -aient.", "Seul <i>être</i> fait exception : <i>ét-</i>."],
  v: [["Circonstances, simultanéité", "<i>Marc montait les escaliers quand elle l'a appelé.</i>"], ["Habitude", "<i>Francine nageait trois fois par semaine.</i>"], ["Imparfait narratif", "<i>Le 8 avril, Marcello épousait Fabienne.</i>"], ["Hypothèse", "<i>Si tu venais, je serais heureux.</i>"], ["Atténuation", "<i>Je venais vous demander un conseil.</i>"], ["Hypocoristique", "<i>Alors, on avait un gros chagrin !</i>"]],
  n: "On garde le <i>i</i> de -ions et -iez après un radical en i, y, ill ou gn : <i>nous croyions, vous craigniez</i>.",
  s: [["T", "p. 145-146"], ["QIF"], ["QIV"]], l: ["borne", "plans", "hypothese"] },
{ id: "passe-simple", p: "ind-simples", t: "Passé simple", forme: "indicatif:Passé simple", tag: ["ind", "simple", "passe"],
  tm: ["Indicatif", "simple", "—", "passé", "non accompli, borné"],
  d: "Temps du récit et de l'écrit. Il inclut les bornes du procès et donne une vue globale de l'action. Il porte le premier plan.",
  f: ["Une voyelle s'intercale entre la base et les marques de personne : <b>a</b>, <b>i</b>, <b>u</b> ou <b>in</b>.", "Verbes en -er : -ai, -as, -a, -âmes, -âtes, -èrent.", "Verbes en -ir et nombreux irréguliers : -is, -is, -it, -îmes, -îtes, -irent.", "Autres irréguliers : -us, -us, -ut, -ûmes, -ûtes, -urent.", "Famille de <i>tenir</i> et <i>venir</i> : -ins, -ins, -int, -înmes, -întes, -inrent."],
  v: [["Événement ponctuel", "<i>François Ier régna trente-deux ans.</i>"], ["Actions successives", "<i>Elle mit son manteau, prit son sac et sortit.</i>"], ["Trame narrative", "<i>J'étais fatiguée, lorsqu'elle vint me dire…</i>"]],
  n: "Pas d'accent circonflexe à la 3e personne du singulier : <i>il disparut</i>. Attention aussi à l'homophonie entre passé simple et participe passé.",
  s: [["T", "p. 146"], ["EPS", "p. 1-5"], ["QSF"], ["QSV"]], l: ["borne", "plans", "ai-ais", "passe-compose"] },
{ id: "futur", p: "ind-simples", t: "Futur", forme: "indicatif:Futur simple", tag: ["ind", "simple", "futur"],
  tm: ["Indicatif", "simple", "—", "futur", "non accompli"],
  d: "Situe l'action dans l'avenir par rapport au présent. Appelé aussi futur simple.",
  f: ["Terminaisons : -rai, -ras, -ra, -rons, -rez, -ront.", "Verbes réguliers en -er : radical + <b>e</b> + terminaison.", "Verbes réguliers en -ir : radical + <b>i</b> + terminaison.", "Radicaux irréguliers : <i>irai, aurai, serai, ferai, pourrai, saurai, viendrai, verrai</i>."],
  v: [["Valeur générale", "<i>Demain, je partirai tôt.</i>"], ["Futur historique", "<i>Quelques années plus tard, il fondera son entreprise.</i>"], ["Valeur impérative", "<i>Vous fermerez la porte.</i>"], ["Atténuation", "<i>Je vous demanderai de faire le silence.</i>"], ["Probabilité", "<i>Elle sera coincée dans les embouteillages.</i>"]],
  n: "Le <i>e</i> s'écrit même s'il ne se prononce pas : <i>crieront, louerez</i>.",
  s: [["T", "p. 145"], ["QFF"], ["QFV"]], l: ["graphies", "rai-rais", "cond-present"] },
{ id: "cond-present", p: "ind-simples", t: "Conditionnel présent", forme: "conditionnel:Présent", tag: ["ind", "simple", "futur"],
  tm: ["Indicatif", "simple", "—", "futur vu du passé", "non accompli"],
  d: "Situe l'action dans l'avenir par rapport au passé. C'est sa valeur temporelle de base.",
  f: ["Même radical qu'au futur.", "Terminaisons : -rais, -rais, -rait, -rions, -riez, -raient.", "Il réunit le <i>-r-</i> du futur et le <i>-ais</i> de l'imparfait."],
  v: [["Futur du passé", "<i>Je pensais que tu trouverais le chemin.</i>"], ["Irréel du présent", "<i>Si je le pouvais, je viendrais.</i>"], ["Éventualité, information non confirmée", "<i>Le Président aurait quitté le pays.</i>"], ["Politesse", "<i>Pourriez-vous me prêter un crayon ?</i>"], ["Imaginaire", "<i>On serait des grands explorateurs.</i>"]],
  s: [["T", "p. 144-145"], ["ECO", "p. 1-3"], ["QCF"], ["QCM"]], l: ["statut-cond", "hypothese", "rai-rais"] },
{ id: "ind-composes", p: "indicatif", t: "Temps composés de l'indicatif", tag: ["ind", "compose"],
  d: "Passé composé, plus-que-parfait, passé antérieur, futur antérieur, conditionnel passé. Chacun correspond à un temps simple et en exprime l'aspect accompli.",
  s: [["T", "p. 144, 146"]], l: ["tcomposes", "accompli"] },
{ id: "passe-compose", p: "ind-composes", t: "Passé composé", forme: "indicatif:Passé composé", tag: ["ind", "compose", "passe"],
  tm: ["Indicatif", "composé", "présent", "passé", "accompli"],
  d: "Formé sur le présent, il exprime l'accompli par rapport au moment où l'on parle, ou un fait révolu. Il remplace largement le passé simple.",
  f: ["Auxiliaire au présent + participe passé."],
  v: [["Fait accompli", "<i>Martin a oublié son nom.</i>"], ["Passé révolu", "<i>Julian est allé à l'opéra la semaine dernière.</i>"], ["Vérité générale", "<i>Il n'a jamais su ce qu'il voulait.</i>"], ["Antériorité", "<i>Si tu as fini ce soir, tu me préviendras.</i>"], ["Futur présenté comme accompli", "<i>Attends-nous, nous avons fini dans cinq minutes.</i>"]],
  s: [["T", "p. 144-145"], ["QPC"]], l: ["passe-simple", "accompli"] },
{ id: "plus-que-parfait", p: "ind-composes", t: "Plus-que-parfait", forme: "indicatif:Plus-que-parfait", tag: ["ind", "compose", "passe"],
  tm: ["Indicatif", "composé", "imparfait", "passé", "accompli"],
  d: "Exprime l'accompli dans le passé, et l'antériorité par rapport à un autre fait passé.",
  f: ["Auxiliaire à l'imparfait + participe passé."],
  v: [["Antériorité", "<i>Il prit ses gants dans le tiroir où il les avait rangés.</i>"], ["Hypothèse", "<i>Si tu étais venu, j'aurais été heureux.</i>"]],
  s: [["T", "p. 144-145"], ["ECC", "p. 2"]], l: ["concordance", "hypothese"] },
{ id: "passe-anterieur", p: "ind-composes", t: "Passé antérieur", forme: "indicatif:Passé antérieur", tag: ["ind", "compose", "passe"],
  tm: ["Indicatif", "composé", "passé simple", "passé", "accompli"],
  d: "Forme composée correspondant au passé simple : il en exprime l'aspect accompli. Le programme de 2026 le fait d'abord conjuguer « par imitation » en 5e, puis identifier en 4e.",
  f: ["Auxiliaire au passé simple + participe passé."],
  x: ["<i>j'eus parlé, je fus sorti(e)</i>"],
  s: [["T", "p. 144"], ["C4N", "programmes de 5e et 4e"]], l: ["passe-simple"] },
{ id: "futur-anterieur", p: "ind-composes", t: "Futur antérieur", forme: "indicatif:Futur antérieur", tag: ["ind", "compose", "futur"],
  tm: ["Indicatif", "composé", "futur", "futur", "accompli"],
  d: "Présente un fait futur comme accompli. Avec le futur, la différence est une différence d'aspect.",
  f: ["Auxiliaire au futur + participe passé."],
  v: [["Accompli à un moment futur", "<i>Dans un mois, ils auront terminé.</i>"], ["Antériorité dans le futur", "<i>Quand tu auras terminé, tu pourras jouer.</i>"], ["Conjecture sur un fait présent", "<i>Elle aura raté son train, sans doute.</i>"]],
  s: [["T", "p. 144-145"], ["ECO", "p. 3"], ["QFA"]], l: ["futur", "accompli"] },
{ id: "cond-passe", p: "ind-composes", t: "Conditionnel passé", forme: "conditionnel:Passé première forme", tag: ["ind", "compose", "futur"],
  tm: ["Indicatif", "composé", "conditionnel présent", "futur vu du passé", "accompli"],
  d: "Parallèle au futur antérieur, il marque l'aspect accompli dans l'avenir vu du passé. Il exprime aussi l'irréel du passé.",
  f: ["Auxiliaire au conditionnel présent + participe passé."],
  v: [["Accompli vu du passé", "<i>Je pensais que Pierre serait revenu à temps.</i>"], ["Irréel du passé", "<i>Si j'avais pu, je serais venu.</i>"]],
  n: "Le Conjugueur donne une « deuxième forme » : <i>j'eusse chanté</i>. Elle a les mêmes formes que le plus-que-parfait du subjonctif.",
  s: [["T", "p. 144"], ["ECO", "p. 2-3"], ["LC"]], l: ["statut-cond", "hypothese", "sub-pqp"] },
{ id: "subjonctif", p: "modes", t: "Subjonctif", tag: ["sub"],
  d: "Mode personnel mais non temporel : il n'a que des valeurs modales. Il exprime l'attitude du locuteur, et non des faits avérés.",
  v: [["Souhait", "<i>Je désire qu'elle vienne.</i>"], ["Regret", "<i>Je regrette qu'elle ait fait cette erreur.</i>"], ["Ordre", "<i>Qu'elle entre !</i>"], ["Supposition", "<i>Soit un triangle A, B, C.</i>"], ["Anticipation", "<i>Je dois partir avant qu'il pleuve.</i>"]],
  x: ["<i>Je cherche un livre qui me plaise.</i> Le subjonctif laisse ouverte l'existence du livre."],
  n: "Les noms « présent » ou « imparfait » sont conventionnels : ils n'indiquent aucune époque.",
  s: [["T", "p. 147-148"], ["ESU", "p. 1-2"]], l: ["que-subj", "modalite", "trois-temps"] },
{ id: "sub-present", p: "subjonctif", t: "Subjonctif présent", forme: "subjonctif:Présent", tag: ["sub", "simple", "nontemp"],
  tm: ["Subjonctif", "simple", "—", "non temporel", "non accompli"],
  d: "Temps simple le plus employé du subjonctif.",
  f: ["Terminaisons : -e, -es, -e, -ions, -iez, -ent, sauf <i>avoir</i> et <i>être</i>.", "Les verbes réguliers en -ir insèrent <b>-iss-</b> : <i>que je finisse</i>.", "Plusieurs irréguliers changent de radical : <i>fasse, puisse, sache, vienne</i>."],
  x: ["<i>Il faut qu'elle fasse un effort.</i>"],
  s: [["T", "p. 148"], ["QSJ"]], l: ["marque-mode", "que-subj"] },
{ id: "sub-imparfait", p: "subjonctif", t: "Subjonctif imparfait", forme: "subjonctif:Imparfait", tag: ["sub", "simple", "nontemp"],
  tm: ["Subjonctif", "simple", "—", "non temporel", "non accompli"],
  d: "Temps de la langue soutenue et littéraire, qu'il faut surtout savoir identifier dans les textes.",
  f: ["Il suit la voyelle du passé simple : <i>-asse, -isse, -usse, -insse</i>.", "3e personne du singulier avec accent circonflexe : <i>qu'il chantât, qu'il fît, qu'il voulût</i>."],
  x: ["<i>Il fallait qu'elle fît un effort.</i>"],
  n: "Le passé simple fournit la base qui permet le subjonctif imparfait.",
  s: [["T", "p. 148"], ["EPS", "p. 1"], ["QSJ"], ["ECC", "p. 1"]], l: ["passe-simple", "concordance"] },
{ id: "sub-passe", p: "subjonctif", t: "Subjonctif passé", forme: "subjonctif:Passé", tag: ["sub", "compose", "nontemp"],
  tm: ["Subjonctif", "composé", "subjonctif présent", "non temporel", "accompli"],
  d: "Forme composée du subjonctif.",
  f: ["Auxiliaire au subjonctif présent + participe passé."],
  x: ["<i>Je regrette qu'elle ait fait cette erreur.</i>"],
  s: [["T", "p. 148"], ["QSJ"], ["C4N", "programme de 3e"]] },
{ id: "sub-pqp", p: "subjonctif", t: "Subjonctif plus-que-parfait", forme: "subjonctif:Plus-que-parfait", tag: ["sub", "compose", "nontemp"],
  tm: ["Subjonctif", "composé", "subjonctif imparfait", "non temporel", "accompli"],
  d: "Forme composée de la langue soutenue et littéraire.",
  f: ["Auxiliaire au subjonctif imparfait + participe passé."],
  x: ["<i>Je regrettais qu'elle eût fait cette erreur.</i>"],
  s: [["T", "p. 148"], ["QSJ"], ["ECC", "p. 1-2"]], l: ["cond-passe", "concordance"] },
{ id: "imperatif", p: "modes", t: "Impératif", tag: ["imp"],
  d: "Mode de l'ordre, personnel mais non temporel. Mode défectif : il n'a que trois personnes et s'emploie sans pronom sujet. Le subjonctif supplée les personnes manquantes : <i>Qu'il sorte !</i>",
  n: "Un ordre négatif s'appelle aussi une défense : <i>Ne dis rien !</i>",
  s: [["T", "p. 149"], ["QIM"]], l: ["imper-s", "imp-present", "imp-passe"] },
{ id: "imp-present", p: "imperatif", t: "Impératif présent", forme: "imperatif:Présent", tag: ["imp", "simple", "nontemp"],
  tm: ["Impératif", "simple", "—", "non temporel", "non accompli"],
  d: "Forme courante de l'impératif.",
  f: ["Verbes en -er : pas de <i>s</i> à la 2e personne du singulier : <i>chante</i>.", "Verbes en -ir, -oir, -re : en général comme à l'indicatif présent : <i>fais</i>.", "<i>Avoir, être, savoir, vouloir</i> empruntent au subjonctif : <i>aie, sois, sache, veuillez</i>."],
  x: ["<i>Chante ! Chantons ! Chantez !</i>"],
  s: [["T", "p. 149"], ["QIM"]], l: ["imper-s"] },
{ id: "imp-passe", p: "imperatif", t: "Impératif passé", forme: "imperatif:Passé", tag: ["imp", "compose", "nontemp"],
  tm: ["Impératif", "composé", "subjonctif présent", "non temporel", "accompli"],
  d: "Forme composée plus rare.",
  f: ["Auxiliaire au subjonctif présent + participe passé."],
  x: ["<i>Ayez fini votre travail quand nous serons rentrés !</i>"],
  n: "Pas de <i>s</i> : <i>Aie mangé.</i>",
  s: [["T", "p. 38, 149"], ["QIM"]] },
{ id: "nonpers", p: "modes", t: "Modes non personnels", tag: ["np"],
  d: "L'infinitif et le participe ignorent la personne. Ils n'ont pas de valeur temporelle propre et se distinguent par l'aspect : à accomplir (<i>lire</i>), en cours (<i>lisant</i>), accompli (<i>lu</i>).",
  n: "Ils font partie de la conjugaison : ne dis pas « formes non conjuguées ».",
  s: [["T", "p. 150-151"]], l: ["infinitif-conj", "infinitif", "part-present", "part-passe"] },
{ id: "infinitif", p: "nonpers", t: "Infinitif", forme: "infinitif:Présent", tag: ["np", "simple", "nontemp"],
  tm: ["Infinitif", "simple", "—", "non temporel", "à accomplir"],
  d: "Forme insensible à la personne. Présent : <i>aimer</i>. Passé : <i>avoir aimé</i>.",
  v: [["Emploi nominal, sujet", "<i>Mentir est honteux.</i>"], ["Emploi nominal, COD", "<i>Je veux partir.</i>"], ["Proposition infinitive", "<i>J'entends les enfants jouer.</i>"], ["Impératif", "<i>Ne pas se pencher par la fenêtre.</i>"], ["Délibératif", "<i>Où aller ?</i>"], ["Narratif", "<i>Et flatteurs d'applaudir.</i>"]],
  s: [["T", "p. 151-152"]], l: ["er-e"] },
{ id: "part-present", p: "nonpers", t: "Participe présent", forme: "participe:Présent", tag: ["np", "simple", "nontemp"],
  tm: ["Participe", "simple", "—", "non temporel", "en cours"],
  d: "Forme en <i>-ant</i>, invariable en emploi verbal. Forme composée : <i>ayant aimé</i>.",
  v: [["Emploi verbal", "<i>Les invités arrivant, je dresse la table.</i>"], ["Emploi adjectival", "<i>une élève aimant la lecture</i>"], ["Emploi adverbial", "<i>Elle est entrée en faisant du bruit.</i>"]],
  s: [["T", "p. 153-156"]], l: ["gerondif", "adj-verbal", "g2"] },
{ id: "gerondif", p: "part-present", t: "Gérondif", forme: "gerondif:Présent", tag: ["np", "simple", "nontemp"],
  d: "Emploi adverbial du participe présent : <i>en</i> + participe présent. Forme invariable, toujours complément circonstanciel.",
  v: [["Temps", "<i>Elle arriva à l'école en criant.</i>"], ["Cause", "<i>Elle a provoqué un accident en roulant trop vite.</i>"], ["Moyen", "<i>Elle a progressé en étudiant.</i>"], ["Manière", "<i>Elle m'écoute en affichant sa bienveillance.</i>"], ["Condition", "<i>Tu réussirais mieux en t'appliquant.</i>"], ["Opposition", "<i>…tout en n'ayant commis aucune infraction.</i>"]],
  n: "La terminologie le traite comme un emploi du participe, pas comme un mode. Le Conjugueur lui donne une rubrique à part.",
  s: [["T", "p. 154-156"], ["LC"]] },
{ id: "part-passe", p: "nonpers", t: "Participe passé", forme: "participe:Passé", tag: ["np", "simple", "nontemp"],
  tm: ["Participe", "simple", "—", "non temporel", "accompli"],
  d: "Il forme les temps composés et le passif, et s'emploie aussi comme adjectif. Forme composée : <i>eu aimé</i>.",
  f: ["Formes en <b>é</b>, <b>i</b>, <b>u</b> et formes avec consonne finale : <i>chanté, fini, vu, pris</i>."],
  v: [["Temps composés", "<i>Elle a chanté.</i>"], ["Voix passive", "<i>La souris est mangée.</i>"], ["Proposition participiale", "<i>Le chat parti, les souris dansent.</i>"], ["Emploi adjectival", "<i>Elle semble fatiguée.</i>"]],
  s: [["T", "p. 157"], ["A4", "p. 7"]], l: ["pp-accords", "er-e"] },

// 4. PERSONNE ET NOMBRE
{ id: "personne", p: "verbe", t: "Personne et nombre",
  d: "Les modes personnels varient selon la personne et le nombre, et parfois le genre. Le verbe prend ces marques de son sujet : c'est l'accord.",
  s: [["T", "p. 143"]], l: ["six-personnes", "accord-sv"] },
{ id: "six-personnes", p: "personne", t: "Les six personnes",
  d: "Trois personnes au singulier et trois au pluriel pour l'indicatif et le subjonctif. L'impératif n'en a que trois.",
  x: ["<i>je, tu, il/elle, nous, vous, ils/elles</i>", "<i>chante, chantons, chantez</i> à l'impératif"],
  n: "Il n'y a pas d'impératif à la 1re personne du singulier. On emploie la 2e personne : <i>Allez, Alice, reprends courage !</i>",
  s: [["T", "p. 149"], ["C4A", "p. 25"]], l: ["marque-personne", "imperatif"] },
{ id: "accord-sv", p: "personne", t: "Accord sujet-verbe",
  d: "Le verbe s'accorde en personne et en nombre avec son sujet, qui est le donneur d'accord.",
  s: [["T", "p. 135"], ["C4A", "p. 24"]], l: ["accord-complexe"] },
{ id: "accord-complexe", p: "accord-sv", t: "Accords complexes",
  d: "Cas listés au programme du cycle 4, à savoir justifier :",
  v: [["Sujet éloigné du verbe", "ou séparé par un complément"], ["Sujet à plusieurs noms", "ou plusieurs personnes"], ["Pronom relatif sujet", "accord avec l'antécédent"], ["Sujet collectif ou distributif", "ou indiquant une quantité"], ["Écran entre sujet et verbe", "pronom ou groupe intercalé"], ["GN avec complément du nom", "programme de 3e"]],
  s: [["C4A", "p. 24"], ["C4N", "programmes de 5e, 4e et 3e"]] },
{ id: "genre", p: "personne", t: "Quand le verbe varie en genre",
  d: "Le genre apparaît dans le participe passé : temps composés avec <i>être</i>, voix passive, et avec <i>avoir</i> lorsque le COD précède.",
  x: ["<i>Elle est partie.</i>", "<i>être mangé(e)(s)</i>"],
  s: [["T", "p. 135, 143, 151"], ["QPA"], ["QPE"]], l: ["pp-accords"] },

// 5. VOIX
{ id: "voix", p: "verbe", t: "Les voix",
  d: "La voix traduit le point de vue sur le procès. Elle indique comment les rôles d'agent (celui qui fait) et de patient (celui qui subit) se répartissent entre le sujet et les compléments. Les deux voix fondamentales sont l'active et la passive.",
  n: "Ne confonds pas voix et forme de phrase : <i>Je sais que Titus est aimé</i> contient une voix passive, mais la phrase n'est pas de forme passive, car le verbe principal est actif.",
  s: [["T", "p. 76, 141"]], l: ["active", "passive", "pronominale"] },
{ id: "active", p: "voix", t: "Voix active",
  d: "Le sujet est l'agent. Les verbes transitifs indirects, intransitifs et attributifs ne s'emploient qu'à cette voix.",
  x: ["<i>La chirurgienne opère les malades.</i>"],
  s: [["T", "p. 141"]], l: ["transitif-indirect", "intransitif", "attributif"] },
{ id: "passive", p: "voix", t: "Voix passive",
  d: "Le sujet est le patient. Seuls les verbes transitifs directs peuvent passer au passif. L'auteur de l'action devient le complément d'agent, introduit par <i>par</i> ou <i>de</i>.",
  f: ["Auxiliaire <i>être</i> au temps du verbe actif + participe passé accordé avec le sujet."],
  x: ["<i>Les malades sont opérés par la chirurgienne.</i>", "<i>La souris a été mangée par le chat.</i>"],
  s: [["T", "p. 76, 139, 141"], ["A4", "p. 7-8"]], l: ["transitif-direct", "auxiliaires"] },
{ id: "pronominale", p: "voix", t: "Voix pronominale",
  d: "La forme verbale est précédée d'un pronom de même personne que le sujet, et l'auxiliaire est toujours <i>être</i>. Le sujet se dédouble en agent et patient, à des degrés divers.",
  x: ["<i>Je me regarde.</i>", "<i>Ils se sont promenés.</i>"],
  n: "L'OQLF classe un peu autrement que la terminologie : il parle aussi de verbes « de sens indistinct ». La carte suit la terminologie, et l'OQLF pour l'accord.",
  s: [["T", "p. 141-142"], ["QPE"]], l: ["pp-pron"] },
{ id: "refl", p: "pronominale", t: "Réfléchi",
  d: "Le sujet applique l'action à lui-même : il est agent et patient.",
  x: ["<i>Elle se coiffe.</i>"],
  s: [["T", "p. 141-142"]] },
{ id: "recip", p: "pronominale", t: "Réciproque",
  d: "Les sujets s'appliquent l'action mutuellement.",
  x: ["<i>Ils se connaissent intimement.</i>"],
  n: "<i>Ils se regardent</i> est ambigu : chacun soi-même, ou l'un l'autre.",
  s: [["T", "p. 142"]] },
{ id: "pron-passif", p: "pronominale", t: "À sens passif",
  d: "Le sujet subit l'action : c'est une variante de la voix passive.",
  x: ["<i>Ce dessert se mange très froid.</i>"],
  s: [["T", "p. 142"]], l: ["passive"] },
{ id: "ess-pron", p: "pronominale", t: "Essentiellement pronominal",
  d: "Sens actif. Le verbe n'existe qu'à la voix pronominale.",
  x: ["<i>Elle s'est évanouie de peur.</i>"],
  s: [["T", "p. 142"]] },
{ id: "occ-pron", p: "pronominale", t: "Occasionnellement pronominal",
  d: "Sens actif. L'emploi pronominal coexiste avec un emploi non pronominal.",
  x: ["<i>Je m'aperçois de mon erreur.</i> / <i>J'aperçois des passants.</i>"],
  s: [["T", "p. 142"]] },
{ id: "factitive", p: "voix", t: "Voix factitive",
  d: "Le sujet fait réaliser l'action par un tiers. Elle se construit avec <i>faire</i> + infinitif et implique deux agents.",
  x: ["<i>Elle fait repeindre la maison par une entreprise.</i>"],
  s: [["T", "p. 142"]], l: ["semi-aux"] },
{ id: "vimpersonnelle", p: "voix", t: "Voix impersonnelle",
  d: "Le sujet <i>il</i> n'a pas de référent. La phrase est de forme impersonnelle seulement si elle équivaut à une phrase non impersonnelle.",
  x: ["<i>Il soufflait un vent de panique.</i> : forme impersonnelle", "<i>Il pleuvait.</i> : voix impersonnelle, sans forme impersonnelle"],
  s: [["T", "p. 79, 142"], ["A4", "p. 7-8"]], l: ["impersonnel"] },

// 6. VALEURS ET ASPECT
{ id: "valeurs", p: "verbe", t: "Valeurs et aspect",
  d: "Au lycée et au concours, on passe de l'identification de la forme à son sens : valeurs temporelles, aspectuelles et modales, concordance des temps, rôle des temps dans le récit et la modalisation.",
  s: [["L2", "objets d'étude"], ["ESU", "p. 1"]], l: ["trois-temps", "aspect", "modalite", "concordance"] },
{ id: "trois-temps", p: "valeurs", t: "Trois sens du mot « temps »",
  d: "Le mot recouvre trois notions à distinguer.",
  v: [["Temps des époques", "passé, présent, futur"], ["Temps aspectuel", "durée interne de l'action : l'aspect"], ["Temps du verbe", "étiquette conventionnelle d'une forme : l'imparfait, le subjonctif présent"]],
  n: "Le temps du verbe n'indique pas toujours une époque : les temps du subjonctif n'ont pas de valeur temporelle.",
  s: [["T", "p. 135"]], l: ["aspect", "subjonctif"] },
{ id: "aspect", p: "valeurs", t: "L'aspect",
  d: "L'aspect décrit la durée interne de l'action : son début, son déroulement, sa fin, quelle que soit l'époque. Le mot regroupe trois réalités : l'aspect grammatical, l'aspect sémantique et l'aspect lexical.",
  s: [["T", "p. 135, 146"]], l: ["accompli", "borne", "asp-semantique", "asp-lexical"] },
{ id: "accompli", p: "aspect", t: "Accompli / non accompli",
  d: "Aspect grammatical marqué par l'opposition entre temps simples et temps composés.",
  x: ["<i>Elle dort.</i> : non accompli, l'action est en cours", "<i>Elle a dormi.</i> : accompli, l'action est achevée"],
  n: "Certaines ressources disent « inaccompli » : c'est la même notion.",
  s: [["T", "p. 146"], ["ECO", "p. 3"], ["A4", "p. 7"]], l: ["tsimples", "tcomposes"] },
{ id: "borne", p: "aspect", t: "Borné / non borné",
  d: "Aspect grammatical : certains temps incluent les bornes du procès et en donnent une vue globale, d'autres le présentent dans son déroulement.",
  x: ["<i>Elle lut une page.</i> : borné, passé simple", "<i>Elle lisait une page.</i> : non borné, imparfait"],
  s: [["T", "p. 146"], ["C4A", "p. 25"]], l: ["passe-simple", "imparfait", "plans"] },
{ id: "plans", p: "aspect", t: "Premier plan / arrière-plan",
  d: "L'aspect influe sur l'emploi des temps dans le récit : le passé simple fait avancer l'histoire, l'imparfait pose le décor et les circonstances.",
  x: ["<i>C'était vendredi et j'étais fatiguée, lorsque ma supérieure vint me dire…</i>"],
  s: [["C4A", "p. 25"], ["A4", "p. 7"], ["QSV"], ["L2", "objets d'étude"]], l: ["passe-simple", "imparfait"] },
{ id: "asp-semantique", p: "aspect", t: "Aspect sémantique",
  d: "Lié au sens du verbe. Un verbe <b>imperfectif</b> a lieu dès le début du procès : <i>marcher</i>. Un verbe <b>perfectif</b> exige que le terme soit atteint : <i>sortir, exploser</i>.",
  x: ["<i>Elle est en train de marcher.</i> est naturel.", "<i>La bombe est en train d'exploser.</i> est très peu probable."],
  s: [["T", "p. 146"]] },
{ id: "asp-lexical", p: "aspect", t: "Aspect lexical",
  d: "Signifié notamment par des semi-auxiliaires : inchoatif, progressif, terminatif.",
  x: ["<i>Elle commence à comprendre.</i> (inchoatif)", "<i>Elle est en train de travailler.</i> (progressif)", "<i>Elle finit de travailler.</i> (terminatif)"],
  s: [["T", "p. 140, 146"]], l: ["semi-aux"] },
{ id: "modalite", p: "valeurs", t: "Valeur modale",
  d: "La modalisation exprime l'attitude du locuteur sur son propos. Un temps de l'indicatif a une valeur modale dès qu'il perd sa valeur temporelle habituelle.",
  v: [["Imparfait", "<i>Si tu travaillais, tu réussirais.</i> L'action n'est pas passée."], ["Conditionnel", "<i>Elle partirait demain matin.</i> (doute)"], ["Futur antérieur", "<i>Elle aura raté son train.</i> (conjecture)"]],
  n: "Ne confonds pas valeur modale et mode.",
  s: [["T", "p. 136, 145"], ["ECO", "p. 3"]], l: ["modes", "hypothese"] },
{ id: "hypothese", p: "valeurs", t: "Système hypothétique",
  d: "Après <i>si</i> de condition, le choix du temps indique la façon d'envisager l'hypothèse.",
  v: [["Si + présent → futur", "<i>Si tu viens, je serai heureux.</i> Hypothèse envisageable."], ["Si + imparfait → conditionnel présent", "<i>Si je le pouvais, je viendrais.</i> Potentiel ou irréel du présent."], ["Si + plus-que-parfait → conditionnel passé", "<i>Si j'avais pu, je serais venu.</i> Irréel du passé."], ["Si + plus-que-parfait → conditionnel présent", "<i>Si tu étais déjà allé à Londres, tu comprendrais.</i>"]],

function dessinerCarte() {
  const can = $("canevas"), svg = can.querySelector("svg");
  can.querySelectorAll(".noeud").forEach(n => n.remove());
  const lignes = [], ligneH = 34, ecartX = 44;
  const places = {};
  function visibles(id, prof, cote, liste) {
    liste.push({ id, prof, cote });
    if (etat.ouverts.has(id)) (enfants[id] || []).forEach(e => visibles(e, prof + 1, cote, liste));
    return liste;
  }
  const tous = [{ id: "verbe", prof: 0, cote: 0 }];

  GAUCHE.forEach(b => visibles(b, 1, -1, tous));

  const col = { "1": [], "-1": [] };
  tous.forEach(n => { if (n.prof) { const c = col[n.cote]; c[n.prof] = Math.max(c[n.prof] || 0, n.l); } });
  const hauteur = id => {
    const e = etat.ouverts.has(id) ? enfants[id] || [] : [];
    return places[id].H = Math.max(ligneH, e.reduce((s, x) => s + hauteur(x), 0));
  };
  const totalD = DROITE.reduce((s, b) => s + hauteur(b) + 10, 0), totalG = GAUCHE.reduce((s, b) => s + hauteur(b) + 10, 0);
  const H = Math.max(totalD, totalG, 300) + 32;
  const largeurCote = c => col[c].reduce((s, w) => s + (w || 0) + ecartX, 0);
  const racine = places.verbe;
  const cx = largeurCote(-1) + racine.l / 2 + 28;
  const W = cx + racine.l / 2 + largeurCote(1) + 28;
  const xCol = (c, p) => { let d = racine.l / 2 + ecartX; for (let i = 1; i < p; i++) d += col[c][i] + ecartX; return d; };
  function poser(id, y0) {
    const n = places[id];
    n.y = y0 + n.H / 2;
    n.x = n.cote > 0 ? cx + xCol(1, n.prof) : cx - xCol(-1, n.prof) - n.l;
    let y = y0;
    if (etat.ouverts.has(id)) (enfants[id] || []).forEach(e => { poser(e, y); y += places[e].H; });
  }
  let y = (H - totalD) / 2; DROITE.forEach(b => { poser(b, y); y += places[b].H + 10; });
  y = (H - totalG) / 2; GAUCHE.forEach(b => { poser(b, y); y += places[b].H + 10; });
  racine.x = cx - racine.l / 2; racine.y = H / 2;
  can.style.width = W + "px"; can.style.height = H + "px";
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  tous.forEach(n => {
    n.el.style.transform = `translate(${n.x}px, ${n.y - n.h / 2}px)`;
    const f = parId[n.id];
    if (!f.p) return;
    const p = places[f.p];
    const x1 = n.cote > 0 ? p.x + p.l : p.x, x2 = n.cote > 0 ? n.x : n.x + n.l, m = (x1 + x2) / 2;
    const eteint = n.el.classList.contains("eteint") ? ' style="opacity:.14"' : "";
    lignes.push(`<path d="M${x1} ${p.y}C${m} ${p.y} ${m} ${n.y} ${x2} ${n.y}" stroke="${COUL[branche(n.id)]}"${eteint}/>`);
  });
  svg.innerHTML = lignes.join("");
  return places;

    const t = trouves();
    if (etat.filtres.size) t.forEach(f => ancetres(f.id).forEach(a => etat.ouverts.add(a)));
    $("bilan").textContent = etat.filtres.size ? `${t.length} notion${t.length > 1 ? "s" : ""}` : "";
    dessinerFiche(); dessiner();
  });
}

function chercher() {
  const brut = $("q").value.trim().toLowerCase();
  const sansAcc = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const r = $("resultats");
  if (!brut) { r.hidden = true; return; }
  const q = sansAcc(brut);
  const score = f => sansAcc(f.t).includes(q) ? 2 : sansAcc(f.d).includes(q) ? 1 : 0;
  const l = FICHES.map(f => [score(f), f]).filter(x => x[0]).sort((a, b) => b[0] - a[0]).slice(0, 8).map(x => x[1]);
  r.innerHTML = l.length ? l.map(f => `<button data-id="${f.id}">${f.t}<small>${f.p ? parId[branche(f.id)].t : "Vue d'ensemble"}</small></button>`).join("") : `<button disabled>Aucune notion trouvée</button>`;
  r.hidden = false;
  r.querySelectorAll("[data-id]").forEach(b => b.onclick = () => { aller(b.dataset.id); });
}
function aller(id) {
  $("q").value = ""; $("resultats").hidden = true;
  if (etat.vue !== "carte") etat.vue = "carte";
  choisir(id, false);
}

function imprimable() {
  $("imprimable").innerHTML = BRANCHES.map(([id, t]) => {
    const liste = []; const f = i => { liste.push(parId[i]); (enfants[i] || []).forEach(f); }; f(id);
    return `<h2>${t}</h2><div class="cols">${liste.map(x => `<article><h3>${x.t}</h3><p>${x.d}</p>${x.f ? `<p>${x.f.join(" ")}</p>` : ""}${x.v ? `<p>${x.v.map(([a, b]) => `<b>${a} :</b> ${b}`).join(" ; ")}</p>` : ""}${x.n ? `<p><b>Attention :</b> ${x.n}</p>` : ""}<small>${x.s.map(([k, p]) => SOURCES[k][1] + (p ? ", " + p : "")).join(" · ")}</small></article>`).join("")}</div>`;
  }).join("");
}

["carte", "classer", "sources"].forEach(v => $("v-" + v).onclick = () => { etat.vue = v; const p = dessiner(); if (p) centrer(etat.choisi, p); });
$("deplier").onclick = () => { FICHES.forEach(f => { if (enfants[f.id]) etat.ouverts.add(f.id); }); dessiner(); };
$("replier").onclick = () => { etat.ouverts = new Set(["verbe", ...BRANCHES.map(b => b[0])]); ancetres(etat.choisi).forEach(a => etat.ouverts.add(a)); dessiner(); };
$("q").oninput = chercher;
$("q").onkeydown = e => {
  if (e.key === "Enter") { const b = $("resultats").querySelector("[data-id]"); if (b) aller(b.dataset.id); }
  if (e.key === "Escape") { $("q").value = ""; $("resultats").hidden = true; }
};
etroit.addEventListener("change", dessiner);
addEventListener("resize", () => { if (etat.vue === "carte" && !etroit.matches) dessiner(); });
document.fonts?.ready.then(() => { const p = dessiner(); centrer("verbe", p); });

poserFiltres(); dessinerSources(); imprimable(); dessinerFiche();
if (etroit.matches) $("fiche").hidden = true;
centrer("verbe", dessiner());
</script>
